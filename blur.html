<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Censor Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Transparent when off, so the browser source shows nothing on stream. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }

  #cover {
    position: fixed; inset: 0;
    opacity: 0; visibility: hidden;
    transition: opacity 120ms ease-out, visibility 0s linear 120ms;
    background: #0b0612;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #cover.on { opacity: 1; visibility: visible; transition: opacity 120ms ease-out; }

  /* Frosted look: big soft color blobs drifting behind a blur. */
  .blobs { position: absolute; inset: -10%; filter: blur(70px) saturate(140%); }
  .blob { position: absolute; border-radius: 50%; opacity: .85; mix-blend-mode: screen; }
  .b1 { width: 55vmax; height: 55vmax; left: -5%;  top: -10%; background: var(--c1); animation: drift1 14s ease-in-out infinite alternate; }
  .b2 { width: 50vmax; height: 50vmax; right: -10%; top: 10%;  background: var(--c2); animation: drift2 17s ease-in-out infinite alternate; }
  .b3 { width: 45vmax; height: 45vmax; left: 25%;  bottom: -20%; background: var(--c3); animation: drift3 12s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(18vw, 12vh) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-16vw, 18vh) scale(.9); } }
  @keyframes drift3 { to { transform: translate(-12vw, -16vh) scale(1.2); } }

  /* Pixel mosaic, drawn small and scaled up with hard edges. */
  #mosaic { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; opacity: .55; display: none; }
  .mosaic #mosaic { display: block; }
  .black .blobs, .black #mosaic { display: none; }

  /* Privacy glass: see-through tinted, ribbed layer. The game moves behind it,
     but stripes, tint and grain hide the detail. A browser source can't read the
     layers under it, so this is the closest thing to a live blur. */
  .glass-tint, .ribs, .sheen { position: absolute; inset: 0; display: none; pointer-events: none; }
  #cover.glass { background: transparent; }
  .glass .blobs, .glass #mosaic { display: none; }
  .glass .glass-tint, .glass .ribs, .glass .sheen { display: block; }
  .glass-tint { background: rgba(16, 8, 28, var(--op)); }
  .ribs { background: repeating-linear-gradient(90deg,
            rgba(255,255,255,.14) 0 .35vmin, rgba(255,255,255,0) .35vmin 1.4vmin,
            rgba(0,0,0,.30) 1.4vmin 1.9vmin, rgba(0,0,0,0) 1.9vmin 2.8vmin); }
  .sheen { background: linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.10) 45%, rgba(255,255,255,0) 60%);
           background-size: 250% 100%; animation: sheen 6s ease-in-out infinite; }
  @keyframes sheen { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .glass .grain { opacity: .22; }

  /* Fine grain so the frosted layer doesn't look flat. */
  .grain { position: absolute; inset: 0; opacity: .08; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  .card {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    text-align: center; color: #fff; padding: calc(3vmin * var(--scale, 1)) calc(6vmin * var(--scale, 1));
    background: rgba(10, 4, 18, .45); border: 1px solid rgba(255,255,255,.18);
    border-radius: 3vmin; backdrop-filter: blur(6px);
    box-shadow: 0 2vmin 6vmin rgba(0,0,0,.45);
    font-family: var(--font, "Segoe UI", system-ui, sans-serif); max-width: 90vw;
  }
  .title { font-size: calc(7vmin * var(--scale, 1)); font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    text-shadow: 0 0 3vmin var(--c2); }
  .sub { margin-top: 1.2vmin; font-size: calc(3vmin * var(--scale, 1)); opacity: .85; letter-spacing: .04em; }
  /* Arabic: letter spacing breaks the joined letters, so turn it off and go right-to-left. */
  .card.rtl { direction: rtl; }
  .card.rtl .title, .card.rtl .sub { letter-spacing: 0; text-transform: none; font-weight: 700; }
  .card.rtl .title { line-height: 1.35; }
  .card.hidden { display: none; }

  /* Setup page (?setup=1): pick a style and copy the link. Never shown on stream. */
  body.setup { background: #0e0a14; color: #eee; font-family: "Segoe UI", system-ui, sans-serif; overflow: auto; }
  .setup-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; display: grid; gap: 20px; grid-template-columns: 1fr 320px; }
  @media (max-width: 860px) { .setup-wrap { grid-template-columns: 1fr; } }
  .setup h1 { grid-column: 1 / -1; margin: 0; font-size: 22px; }
  .stage { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #2b3b4f; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  .demo { position: absolute; inset: 0; background: linear-gradient(#7fb2e5, #d9c49a 55%, #6d6a63 56%, #4b4a46); }
  .demo .car { position: absolute; bottom: 14%; width: 18%; height: 12%; background: #c0392b; border-radius: 30% 30% 12% 12%; animation: drive 4s linear infinite; }
  .demo .sun { position: absolute; top: 8%; width: 9%; aspect-ratio: 1; border-radius: 50%; background: #ffe066; animation: float 6s ease-in-out infinite alternate; }
  .demo .person { position: absolute; bottom: 20%; left: 60%; width: 5%; height: 28%; background: #3d2b56; border-radius: 40% 40% 10% 10%; animation: walk 3s ease-in-out infinite alternate; }
  @keyframes drive { from { left: -20%; } to { left: 105%; } }
  @keyframes float { from { left: 10%; } to { left: 30%; } }
  @keyframes walk { from { left: 55%; } to { left: 75%; } }
  .panel { display: grid; gap: 14px; align-content: start; }
  .panel label { display: grid; gap: 6px; font-size: 13px; color: #bbb; }
  .panel input[type=text], .panel select { background: #1c1526; color: #fff; border: 1px solid #3a2d4d; border-radius: 8px; padding: 8px 10px; font: inherit; }
  .styles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .styles button { background: #1c1526; color: #eee; border: 1px solid #3a2d4d; border-radius: 8px; padding: 10px; font: inherit; cursor: pointer; }
  .styles button.active { border-color: #ff2d95; background: #2a1736; }
  .colors { display: flex; gap: 10px; }
  .colors input { width: 44px; height: 32px; border: 0; background: none; padding: 0; }
  .link { grid-column: 1 / -1; display: flex; gap: 8px; }
  .link input { flex: 1; min-width: 0; background: #1c1526; color: #fff; border: 1px solid #3a2d4d; border-radius: 8px; padding: 10px; font: 14px ui-monospace, Consolas, monospace; }
  .link button { background: #ff2d95; color: #fff; border: 0; border-radius: 8px; padding: 0 18px; font: 600 14px inherit; cursor: pointer; }
  .note { grid-column: 1 / -1; font-size: 13px; color: #999; margin: 0; }
</style>
</head>
<body>
<div id="cover">
  <div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <canvas id="mosaic" width="48" height="27"></canvas>
  <div class="glass-tint"></div>
  <div class="ribs"></div>
  <div class="sheen"></div>
  <div class="grain"></div>
  <div class="card" id="card">
    <div class="title" id="title">Scene Skipped</div>
    <div class="sub" id="sub">Back in a moment</div>
  </div>
</div>
<script>
  // URL options, e.g. blur.html?style=glass&op=0.85&text=Censored&sub=
  //   style: frost (default) | mosaic | black | glass
  //   op: glass darkness 0.5-0.98 (default 0.85; higher hides more)
  //   text / sub: card text (empty sub hides it; text=none hides the card)
  //   font: default | cairo (Cairo Bold, from Google Fonts) | dubai (Dubai Bold, built into Windows)
  //   size: text size 0.5-2.5 (default 1)
  //   c1 c2 c3: blob/mosaic colors
  //   setup=1: open the style picker instead of the overlay (keeps the other options as a starting point)
  const q = new URLSearchParams(location.search);
  const FONTS = {
    default: '"Segoe UI", system-ui, sans-serif',
    cairo: '"Cairo", "Segoe UI", sans-serif',
    dubai: '"Dubai", "Cairo", "Segoe UI", sans-serif',
  };
  const isArabic = s => /[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/.test(s);

  if (q.get('setup') === '1') {
    buildSetup();
  } else {
    showCover();
  }

  function showCover() {
    const cover = document.getElementById('cover');
    const root = document.documentElement.style;
    root.setProperty('--c1', q.get('c1') || '#7b2cff');
    root.setProperty('--c2', q.get('c2') || '#ff2d95');
    root.setProperty('--c3', q.get('c3') || '#2d6bff');
    const op = Math.min(.98, Math.max(.5, parseFloat(q.get('op')) || .85));
    root.setProperty('--op', op);
    root.setProperty('--scale', Math.min(2.5, Math.max(.5, parseFloat(q.get('size')) || 1)));
    root.setProperty('--font', FONTS[q.get('font')] || FONTS.default);

    const style = q.get('style') || 'frost';
    cover.classList.add(style);
    if (q.has('text')) {
      if (q.get('text') === 'none') document.getElementById('card').classList.add('hidden');
      else document.getElementById('title').textContent = q.get('text');
    }
    if (q.has('sub')) {
      const sub = document.getElementById('sub');
      sub.textContent = q.get('sub');
      sub.style.display = q.get('sub') ? '' : 'none';
    }
    const card = document.getElementById('card');
    if (isArabic(card.textContent)) card.classList.add('rtl');

    // Mosaic: low-res random tiles in the theme colors, redrawn a few times a second.
    if (style === 'mosaic') {
      const cv = document.getElementById('mosaic'), ctx = cv.getContext('2d');
      const cols = [root.getPropertyValue('--c1'), root.getPropertyValue('--c2'), root.getPropertyValue('--c3'), '#140a24', '#2a1640'];
      const draw = () => {
        for (let y = 0; y < cv.height; y++)
          for (let x = 0; x < cv.width; x++) {
            ctx.fillStyle = cols[(Math.random() * cols.length) | 0];
            ctx.globalAlpha = .35 + Math.random() * .65;
            ctx.fillRect(x, y, 1, 1);
          }
      };
      draw(); setInterval(draw, 250);
    }

    // Always on: show/hide the browser source in the streaming app to censor.
    requestAnimationFrame(() => cover.classList.add('on'));
  }

  function buildSetup() {
    document.getElementById('cover').remove();
    document.body.className = 'setup';
    document.body.innerHTML = `
      <div class="setup-wrap">
        <h1>Censor overlay: pick a style</h1>
        <div class="stage">
          <div class="demo"><div class="sun"></div><div class="person"></div><div class="car"></div></div>
          <iframe id="preview" title="Preview"></iframe>
        </div>
        <div class="panel">
          <div class="styles">
            <button data-style="frost">Frost</button>
            <button data-style="mosaic">Mosaic</button>
            <button data-style="black">Black</button>
            <button data-style="glass">Glass (see-through)</button>
          </div>
          <label id="opWrap">Glass darkness: <span id="opVal"></span>
            <input type="range" id="op" min="0.5" max="0.98" step="0.01" value="0.85"></label>
          <label>Big text (empty = no card)<input type="text" id="text" dir="auto" value="Scene Skipped"></label>
          <label>Small text (empty = hidden)<input type="text" id="sub" dir="auto" value="Back in a moment"></label>
          <label>Font<select id="font">
            <option value="default">Default (Segoe UI)</option>
            <option value="cairo">Cairo Bold</option>
            <option value="dubai">Dubai Bold</option>
          </select></label>
          <label>Text size: <span id="sizeVal"></span>
            <input type="range" id="size" min="0.5" max="2.5" step="0.1" value="1"></label>
          <label>Colors<span class="colors">
            <input type="color" id="c1" value="#7b2cff"><input type="color" id="c2" value="#ff2d95"><input type="color" id="c3" value="#2d6bff"></span></label>
        </div>
        <div class="link"><input id="out" readonly><button id="copy">Copy link</button></div>
        <p class="note">The scene behind the preview is a fake game, just to show what viewers see. Glass lets movement show through;
          for sex scenes keep darkness at 0.85 or higher, or use Frost, Mosaic or Black to hide everything.</p>
      </div>`;

    const $ = id => document.getElementById(id);
    const base = location.href.split(/[?#]/)[0];
    let style = q.get('style') || 'frost';

    // Start from the link it was opened with, so an existing link can be edited.
    if (q.has('op')) $('op').value = q.get('op');
    if (q.has('text')) $('text').value = q.get('text') === 'none' ? '' : q.get('text');
    if (q.has('sub')) $('sub').value = q.get('sub');
    if (q.has('font') && FONTS[q.get('font')]) $('font').value = q.get('font');
    if (q.has('size')) $('size').value = q.get('size');
    for (const k of ['c1', 'c2', 'c3']) if (q.has(k)) $(k).value = q.get(k);

    // Keep Arabic readable in the link: only encode the characters that would break it.
    const enc = s => s.replace(/[%&#+?=\s]/g, c => c === ' ' ? '%20' : encodeURIComponent(c));

    const update = () => {
      const p = [];
      if (style !== 'frost') p.push(['style', style]);
      if (style === 'glass' && $('op').value !== '0.85') p.push(['op', $('op').value]);
      const text = $('text').value.trim(), sub = $('sub').value.trim();
      if (!text) p.push(['text', 'none']); else if (text !== 'Scene Skipped') p.push(['text', text]);
      if (sub !== 'Back in a moment') p.push(['sub', sub]);
      if ($('font').value !== 'default') p.push(['font', $('font').value]);
      if ($('size').value !== '1') p.push(['size', $('size').value]);
      for (const [k, d] of [['c1', '#7b2cff'], ['c2', '#ff2d95'], ['c3', '#2d6bff']])
        if ($(k).value !== d) p.push([k, $(k).value]);
      const qs = p.map(([k, v]) => k + '=' + enc(v)).join('&');
      $('out').value = base + (qs ? '?' + qs : '');
      $('preview').src = base + '?' + qs;
      $('opWrap').style.display = style === 'glass' ? '' : 'none';
      $('opVal').textContent = $('op').value;
      $('sizeVal').textContent = $('size').value + 'x';
      document.querySelectorAll('.styles button').forEach(b => b.classList.toggle('active', b.dataset.style === style));
    };

    document.querySelectorAll('.styles button').forEach(b => b.onclick = () => { style = b.dataset.style; update(); });
    ['op', 'text', 'sub', 'font', 'size', 'c1', 'c2', 'c3'].forEach(id => $(id).addEventListener('input', update));
    $('copy').onclick = async () => {
      try { await navigator.clipboard.writeText($('out').value); } catch { $('out').select(); document.execCommand('copy'); }
      $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy link', 1200);
    };
    update();
  }
</script>
</body>
</html>
