    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;700&family=JetBrains+Mono:wght@700&display=swap');
        
        body {
            background: transparent;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            color: white;
        }

        /* Clamping Brackets */
        .bracket {
            position: absolute;
            width: 2vw;
            height: 12vw;
            border: 0.4vw solid var(--accent);
            filter: drop-shadow(0 0 1vw var(--accent));
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 20;
        }

        .bracket-left {
            left: 0;
            border-right: 0;
            border-radius: 1vw 0 0 1vw;
            transform: translateX(-10vw);
        }

        .bracket-right {
            right: 0;
            border-left: 0;
            border-radius: 0 1vw 1vw 0;
            transform: translateX(10vw);
        }

        .active .bracket-left { transform: translateX(0); }
        .active .bracket-right { transform: translateX(0); }

        .carousel-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4vw;
            padding: 2vw 6vw;
            min-width: 45vw;
        }

        .platform-logo {
            filter: drop-shadow(0 0 1vw var(--accent));
            width: 7vw;
            height: 7vw;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .active .platform-logo {
            opacity: 1;
            transform: scale(1);
        }

        .text-content {
            display: flex;
            flex-col: column;
            opacity: 0;
            transform: translateX(2vw);
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1) 0.2s;
        }

        .active .text-content {
            opacity: 1;
            transform: translateX(0);
        }

        .handle {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: slashed-zero;
            text-transform: none;
            font-size: 4.5vw;
            font-weight: 700;
            text-shadow: 0 0 2vw var(--accent-low);
            white-space: nowrap;
        }

        .platform-name {
            font-size: 1.2vw;
            font-weight: 700;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            opacity: 0.4;
            margin-bottom: 0.5vw;
            font-family: 'Syncopate', sans-serif;
        }

        /* Exit Animation */
        .exit .bracket-left { transform: translateX(20vw) scaleX(0); opacity: 0; }
        .exit .bracket-right { transform: translateX(-20vw) scaleX(0); opacity: 0; }
        .exit .platform-logo { transform: scale(0); opacity: 0; }
        .exit .text-content { transform: scale(0.9); opacity: 0; filter: blur(1vw); }
        .exit .progress-bar { transform: translateX(-50%) scaleX(0); opacity: 0; transition-delay: 0s; }

        .progress-bar {
            position: absolute;
            bottom: -1vw;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 33vw;
            height: 0.3vw;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1vw;
            overflow: hidden;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1) 0.3s;
        }

        .active .progress-bar {
            opacity: 1;
            transform: translateX(-50%) scaleX(1);
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
        }
    </style>

<body>
    <div id="app" class="relative z-10">
        <div id="container" class="carousel-container active">
            <div class="bracket bracket-left"></div>
            
            <img id="logo" src="./socials-carousel_files/53FC18" alt="logo" class="platform-logo">
            
            <div class="text-content flex flex-col">
                <span id="platform" class="platform-name">Kick</span>
                <span id="handle" class="handle" style="color: rgb(83, 252, 24);">v01d_47</span>
            </div>

            <div class="bracket bracket-right"></div>

            <div class="progress-bar">
                <div id="progress" class="progress-fill" style="transition: width 5000ms linear; width: 100%;"></div>
            </div>
        </div>
    </div>

    <script>
        // Sound removed: the swoosh is disabled, this overlay is silent.
        function playSwoosh() {}

        const socials = [
            { name: 'Twitch', handle: 'v01d_47', logo: 'https://cdn.simpleicons.org/twitch/9146FF', color: '#9146FF' },
            { name: 'Kick', handle: 'v01d_47', logo: 'https://cdn.simpleicons.org/kick/53FC18', color: '#53FC18', text: '#53FC18' },
            { name: 'YouTube', handle: 'v01d.47', logo: 'https://cdn.simpleicons.org/youtube/FF0000', color: '#FF0000' },
            { name: 'Instagram', handle: 'v01d.47', logo: 'https://cdn.simpleicons.org/instagram/E4405F', color: '#E4405F' },
            { name: 'TikTok', handle: 'v01d.47', logo: 'https://cdn.simpleicons.org/tiktok/white', color: '#ffffff' }
        ];

        let currentIndex = 0;
        const app = document.getElementById('app');
        const container = document.getElementById('container');
        const logo = document.getElementById('logo');
        const platform = document.getElementById('platform');
        const handle = document.getElementById('handle');
        const progress = document.getElementById('progress');

        function updateSocial() {
            // Exit previous
            container.classList.remove('active');
            container.classList.add('exit');
            
            setTimeout(() => {
                const social = socials[currentIndex];
                
                // Set colors
                document.documentElement.style.setProperty('--accent', social.color);
                document.documentElement.style.setProperty('--accent-low', social.color + '33');
                handle.style.color = social.text || '#ffffff';

                // Set content
                logo.src = social.logo;
                platform.innerText = social.name;
                handle.innerText = social.handle;
                
                // Reset classes
                container.classList.remove('exit');
                
                // Trigger Reflow for entrance
                void container.offsetWidth;
                container.classList.add('active');
                
                playSwoosh(social.name === 'Twitch' ? 600 : 300);

                // Progress animation
                progress.style.transition = 'none';
                progress.style.width = '0%';
                requestAnimationFrame(() => {
                    progress.style.transition = 'width 5000ms linear';
                    progress.style.width = '100%';
                });

                currentIndex = (currentIndex + 1) % socials.length;
            }, 800);
        }

        updateSocial();
        setInterval(updateSocial, 6000);
        const firehose = new Firehose();
    </script>
